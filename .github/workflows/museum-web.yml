name: Build museum web game
on:
  push:
    branches: [main, feat/museum-integration]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mummy-web-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify museum bridge
        run: node tests/test_museum_bridge.cjs
      - name: Install matching Godot editor and web templates
        shell: bash
        run: |
          set -euo pipefail
          release=https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable
          curl --fail --location --retry 3 "$release/Godot_v4.7.2-stable_linux.x86_64.zip" -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
          curl --fail --location --retry 3 "$release/Godot_v4.7.2-stable_export_templates.tpz" -o "$RUNNER_TEMP/templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          unzip -j -q "$RUNNER_TEMP/templates.tpz" 'templates/web_nothreads_release.zip' -d "$HOME/.local/share/godot/export_templates/4.7.2.stable"
      - name: Import and verify game sessions
        run: |
          Godot_v4.7.2-stable_linux.x86_64 --headless --editor --import --quit
          Godot_v4.7.2-stable_linux.x86_64 --headless --script res://tests/test_session.gd
      - name: Export public runtime only
        run: |
          mkdir -p "$RUNNER_TEMP/web"
          Godot_v4.7.2-stable_linux.x86_64 --headless --export-release Web "$RUNNER_TEMP/web/index.html"
          cp web/*.js "$RUNNER_TEMP/web/"
          cp AUDIO-LICENSES.md FONT-LICENSES.md GODOT-LICENSE.txt GODOT-COPYRIGHT.txt "$RUNNER_TEMP/web/"
          test -s "$RUNNER_TEMP/web/index.pck"
          test -s "$RUNNER_TEMP/web/index.wasm"
      - uses: actions/upload-artifact@v4
        with:
          name: mummy-museum-web-${{ github.sha }}
          path: ${{ runner.temp }}/web
          retention-days: 14
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && vars.MUMMY_PAGES_ENABLED == 'true'
        with:
          path: ${{ runner.temp }}/web
  deploy:
    if: github.ref == 'refs/heads/main' && vars.MUMMY_PAGES_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Publish compiled public game
        id: deployment
        uses: actions/deploy-pages@v4
