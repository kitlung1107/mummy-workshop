<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>木乃伊工房｜多尺寸預覽</title>
<style>*{box-sizing:border-box}body{margin:0;background:#082e38;color:#fff0ce;font:16px system-ui}header{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:14px 20px;border-bottom:1px solid #477077}strong{font-size:20px;margin-right:auto}select,button,a{font:inherit;min-height:44px;padding:10px 14px;border-radius:9px;border:1px solid #e7bd73;background:#174d58;color:#fff0ce}a{text-decoration:none}p{margin:10px 20px;color:#b4cdcb;font-size:14px}#stage{position:relative;margin:auto;overflow:hidden}iframe{position:absolute;left:50%;top:0;border:0;transform-origin:top center;box-shadow:0 0 0 1px #477077;background:#123e46}</style>
<header><strong>木乃伊工房 · 11/17 選項完整重畫</strong><label>畫面尺寸 <select id="size"><option value="390,844">手機轉橫向提示 · 390 × 844</option><option value="844,390" selected>手機橫屏 · 844 × 390</option><option value="768,1024">iPad 轉橫向提示 · 768 × 1024</option><option value="1024,768">iPad 橫屏 · 1024 × 768</option><option value="1366,900">桌面 · 1366 × 900</option><option value="1920,1080">大桌面 · 1920 × 1080</option></select></label><button id="rotate">切換方向</button><a href="index.html" target="_blank" rel="noopener">全視窗遊玩 ↗</a></header>
<p>這是瀏覽器尺寸預覽，並非手機或 iPad 真機驗證。切換尺寸會保留遊戲進度；聲音請按遊戲內「開啟聲音」。</p>
<div id="stage"><iframe title="木乃伊工房遊戲" src="index.html" allow="autoplay; fullscreen"></iframe></div>
<script>const pick=document.querySelector('#size'),frame=document.querySelector('iframe'),stage=document.querySelector('#stage');let dimensions=pick.value.split(',').map(Number);function layout(){let[w,h]=dimensions;const top=stage.getBoundingClientRect().top,scale=Math.min(1,(innerWidth-24)/w,Math.max(240,innerHeight-top-16)/h);frame.style.width=w+'px';frame.style.height=h+'px';frame.style.transform=`translateX(-50%) scale(${scale})`;stage.style.width='100%';stage.style.height=h*scale+'px'}pick.onchange=()=>{dimensions=pick.value.split(',').map(Number);layout()};document.querySelector('#rotate').onclick=()=>{dimensions.reverse();layout()};onresize=layout;layout();</script></html>
